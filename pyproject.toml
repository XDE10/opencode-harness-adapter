[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-harness-adapter"
version = "0.5.0"
description = "Single-GPU colocated Agentic RL (Dr.GRPO + Dual-Ratio TIS-Clip, Prefix-Merged Packing, 248-Module LoRA) for unmodified CLI coding harnesses (OpenCode, Pi, mini-swe-agent)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "pytest>=8.0",
]

[project.optional-dependencies]
gpu = [
    "vllm>=0.8.5",
    "torch>=2.5",
    "transformers>=4.49",
    "peft>=0.14",
    "accelerate>=1.0",
    "safetensors>=0.4.5",
    "flash-linear-attention>=0.1",
    "datasets>=2.20",
    "huggingface-hub>=0.26",
    "hf-transfer>=0.1.8",
]

[project.urls]
Homepage = "https://github.com/XDE10/opencode-harness-adapter"
Repository = "https://github.com/XDE10/opencode-harness-adapter"
"Pretrained Weights" = "https://huggingface.co/XDE10/Qwen3.5-9B-Harness-Adapters-v5"

[tool.setuptools.packages.find]
include = ["oca*"]
