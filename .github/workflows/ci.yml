name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e . numpy
      - name: Run full v4 + v5 unit test suite
        run: python -m unittest discover -s tests -v
      - name: Run 10-attack adversarial anti-hack suite
        run: python -m oca.adversarial
